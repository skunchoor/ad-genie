[project]
name = "ad-genie"
version = "0.1.0"
description = "AdGenie: The AI-Powered Product Description Writer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "flask-cors>=6.0.2",
    "openai>=1.63.2",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "flake8>=7.1.1",
    "pytest>=8.3.4",
]

[tool.flake8]
ignore = ["E402"]
