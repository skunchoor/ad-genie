[project]
name = "ad-genie"
version = "0.1.0"
description = "AdGenie: The AI-Powered Product Description Writer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "openai>=1.63.2",
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "flake8>=7.1.1",
    "pytest>=8.3.4",
]

[tool.flake8]
ignore = ["E402"]
